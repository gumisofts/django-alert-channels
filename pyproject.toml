[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "django-alert-channels"
version = "0.1.0"
description = "A logging handler that sends errors and alerts to Telegram, SMS, webhooks, a Redis bus, email or your own function."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["django", "logging", "alerts", "telegram", "sms", "webhook", "celery"]
classifiers = [
    "Framework :: Django",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Logging",
    "Topic :: System :: Monitoring",
]
dependencies = []

[project.optional-dependencies]
redis = ["redis>=4"]
dev = ["django>=4.2", "celery>=5", "redis>=4"]

[tool.setuptools.packages.find]
where = ["src"]
